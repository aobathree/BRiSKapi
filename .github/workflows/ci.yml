name: Recorder and archive CI
on:
  pull_request:

  push:

permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m pytest tests --cov=archive_schema --cov=archive_service --cov=brisk_archive --cov=brisk --cov-fail-under=85
      - run: python -m pytest tools/brisk_mock/test_download.py
      - run: python tools/brisk_mock/download_mock.py --cache /tmp/brisk-mock-cache
      - name: Verify archive reference against the pinned demo replay
        run: python -m pytest tools/brisk_mock/test_reference.py
        env:
          BRISK_MOCK_CACHE: /tmp/brisk-mock-cache
      - run: node --test --experimental-test-coverage tools/brisk_mock/*.test.cjs
        env:
          BRISK_MOCK_CACHE: /tmp/brisk-mock-cache
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path rust/brisk_quote_ingest/Cargo.toml
        env:
          BRISK_MOCK_CACHE: /tmp/brisk-mock-cache
      - run: cargo fmt --manifest-path rust/brisk_quote_ingest/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path rust/brisk_quote_ingest/Cargo.toml --all-targets -- -D warnings
      - name: Install pinned Nautilus v2 test runtime
        run: python -m pip install --extra-index-url https://packages.nautechsystems.io/simple -r tools/brisk_mock/requirements-v2.txt
      - name: Build in-process Rust state
        run: python tools/brisk_mock/build_native.py --output /tmp/brisk-native
      - name: Verify actual Nautilus v2 bus and strategy
        run: python -m pytest -q tools/brisk_mock/test_nautilus_v2.py
        env:
          BRISK_MOCK_CACHE: /tmp/brisk-mock-cache
          PYTHONPATH: /tmp/brisk-native
      - run: cargo clippy --locked --manifest-path rust/brisk_quote_ingest/Cargo.toml --all-targets --features python -- -D warnings
