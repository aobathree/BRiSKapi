[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "briskapi"
version = "0.2.0"
description = "Unofficial Python API, live feed and shared archive for BRiSK auction data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["boto3>=1.41,<2"]

[project.optional-dependencies]
pandas = ["pandas>=2"]

[project.urls]
Source = "https://github.com/honvl/BRiSKapi"

[project.scripts]
brisk = "briskapi.cli:main"

# Self-contained: the archive settings, reference fingerprints, Node decoder
# hosts and asset pins ship inside the package. Vendor assets never do.
[tool.setuptools]
packages = ["briskapi"]

[tool.setuptools.package-data]
briskapi = ["archive.json", "references/*.json", "decoder/*.cjs", "decoder/assets.json", "LICENSE-pybrisk.txt"]
